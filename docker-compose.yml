services:
  postgres:
    image: postgres:16
    container_name: minibanca-postgres
    environment:
      POSTGRES_DB: minibanca
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"   # solo para desarrollo; en la lección de Docker lo cerraremos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d minibanca"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
