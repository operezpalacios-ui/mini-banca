# Lección 14: TODA la aplicación con un solo comando:   docker compose up --build
# (En tu ordenador no hay Docker; este fichero lo usa GitHub Actions para la prueba de humo,
#  y te servirá en cualquier ordenador o servidor que sí lo tenga.)
#
# Las variables ${...} se leen del fichero .env de esta misma carpeta (o del entorno).
# ":?" = si falta, Docker se niega a arrancar con ese mensaje (mejor que arrancar sin clave).
#
#   navegador ──► frontend (nginx :4200) ──/api/──► gateway ──► orquestador ──► core ──► postgres / redis
#                                                      └──► redis (limitador de peticiones)
#
# Lección 15: SOLO se publica al exterior (ports) el frontend. Todo lo demás vive DENTRO de la red de
# Docker: nginx reenvía /api/ al gateway (proxy inverso), y desde fuera no se llega ni al gateway,
# ni al orquestador, ni al core, ni a la base de datos, ni a Redis. Menos puertas abiertas = menos riesgo.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: minibanca
      POSTGRES_USER: minibanca
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Falta LOCAL_DB_PASSWORD en el .env}
    volumes:
      - pgdata:/var/lib/postgresql   # los datos sobreviven aunque se borre el contenedor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minibanca -d minibanca"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build: ./core
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/minibanca   # "postgres" = el nombre del servicio de arriba
      DB_USER: minibanca
      DB_PASSWORD: ${LOCAL_DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Falta INTERNAL_API_KEY en el .env}
      SPRING_PROFILES_ACTIVE: prod   # lección 15: logs JSON, sin SQL en consola, sin detalles de salud
    depends_on:
      postgres:
        condition: service_healthy   # no arrancar hasta que Postgres diga "estoy listo"
      redis:
        condition: service_healthy

  orquestador:
    build: ./orquestador
    environment:
      CORE_URL: http://core:8080
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en el .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SPRING_PROFILES_ACTIVE: prod   # Swagger apagado, sin CORS (misma web gracias a nginx)
      # Lección 16: casi nunca hace falta (nginx = misma web). Excepción: GitHub Codespaces reescribe la
      # cabecera Origin a http://localhost:4200, así que ahí hay que permitir ese origen en el .env.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    # Sin "ports": el orquestador ya NO es accesible desde fuera, solo a través del gateway
    depends_on:
      core:
        condition: service_healthy

  # API GATEWAY: puerta de entrada de la API (limitador por IP, circuit breaker, traceId).
  # No necesita secretos: ni la clave JWT ni la clave interna.
  gateway:
    build: ./gateway
    environment:
      ORQUESTADOR_URL: http://orquestador:8081
      REDIS_URL: redis://redis:6379   # el mismo Redis que la caché del core
      SPRING_PROFILES_ACTIVE: prod
    # Sin "ports": solo nginx habla con el gateway
    depends_on:
      orquestador:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-4200}:80"   # lección 16: cada entorno en su puerto (pruebas 8091, producción 80)
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  pgdata:
