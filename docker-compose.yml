# Lección 14: TODA la aplicación con un solo comando:   docker compose up --build
# (En tu ordenador no hay Docker; este fichero lo usa GitHub Actions para la prueba de humo,
#  y te servirá en cualquier ordenador o servidor que sí lo tenga.)
#
# Las variables ${...} se leen del fichero .env de esta misma carpeta (o del entorno).
# ":?" = si falta, Docker se niega a arrancar con ese mensaje (mejor que arrancar sin clave).
#
#   navegador ──► frontend (nginx :4200) ──/api/──► orquestador ──► core ──► postgres / redis
#
# Lección 15: SOLO se publica al exterior (ports) el frontend. Todo lo demás vive DENTRO de la red de
# Docker: nginx reenvía /api/ al orquestador (proxy inverso), y desde fuera no se llega ni al
# orquestador, ni al core, ni a la base de datos, ni a Redis. Menos puertas abiertas = menos riesgo.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: minibanca
      POSTGRES_USER: minibanca
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Falta LOCAL_DB_PASSWORD en el .env}
    volumes:
      - pgdata:/var/lib/postgresql   # los datos sobreviven aunque se borre el contenedor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minibanca -d minibanca"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build: ./core
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/minibanca   # "postgres" = el nombre del servicio de arriba
      DB_USER: minibanca
      DB_PASSWORD: ${LOCAL_DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Falta INTERNAL_API_KEY en el .env}
      SPRING_PROFILES_ACTIVE: prod   # lección 15: logs JSON, sin SQL en consola, sin detalles de salud
    depends_on:
      postgres:
        condition: service_healthy   # no arrancar hasta que Postgres diga "estoy listo"
      redis:
        condition: service_healthy

  orquestador:
    build: ./orquestador
    environment:
      CORE_URL: http://core:8080
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en el .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SPRING_PROFILES_ACTIVE: prod   # Swagger apagado, sin CORS (misma web gracias a nginx)
    # Sin "ports": el orquestador ya NO es accesible desde fuera, solo a través de nginx
    depends_on:
      core:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      orquestador:
        condition: service_healthy

volumes:
  pgdata:
