# Lección 12: configuración SOLO para los tests del core.
# Se suma a src/main/resources/application.yml y, si una clave coincide, gana esta.
# Valores FALSOS a propósito: los tests nunca deben depender de tus secretos reales del .env
# (en GitHub Actions ni siquiera existirá el .env).

# Clave interna de mentira (el filtro exige mínimo 32 caracteres)
internal.api-key=clave-interna-solo-para-tests-0123456789

# La URL de la BBDD la pone Testcontainers; usuario y contraseña, también. Estos solo evitan el error
# "no encuentro DB_USER" en los tests que no usan base de datos.
spring.datasource.username=test
spring.datasource.password=test

# Nunca tocar el Redis real (Upstash) desde un test
spring.data.redis.url=redis://localhost:6379

# Menos ruido en la consola de los tests
spring.jpa.show-sql=false
logging.level.org.springframework.cache=info
