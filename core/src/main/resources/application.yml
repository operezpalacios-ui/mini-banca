spring:
  application:
    name: core
  config:
    # En desarrollo lee DB_USER y DB_PASSWORD del .env de la raíz (si existe).
    # En producción vendrán de variables de entorno reales.
    # Lo buscamos en la carpeta padre (si arrancas desde core/) y en la actual (si arrancas desde mini-banca/)
    import: optional:file:../.env[.properties],optional:file:./.env[.properties]
  mvc:
    async:
      # Lección 9: tiempo máximo de una respuesta en streaming (exportación CSV)
      request-timeout: 2m
  # Lección 11: Redis para la caché. Si no hay Redis, la app sigue funcionando (sin caché).
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: 2s
      timeout: 500ms        # si Redis tarda más, mejor ir a la BBDD que dejar al usuario esperando
  datasource:
    # Si DB_URL no está definida, usa el Postgres local de Docker
    url: ${DB_URL:jdbc:postgresql://localhost:5432/minibanca}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate      # Hibernate solo comprueba; las tablas las crea Flyway
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        # Lección 3: al final de cada petición Hibernate dice cuántas consultas SQL ha lanzado
        # ("... executing N JDBC statements"). Útil para cazar el N+1; en producción, false.
        generate_statistics: true

# Lección 8 (RF-0.3): clave compartida con el orquestador. Sin ella, /internal/** responde 401.
internal:
  api-key: ${INTERNAL_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always    # solo en desarrollo: verás el estado de la BBDD

logging:
  level:
    # Lección 11: en el log verás "Cache entry for key '1' found" (acierto) o "No cache entry" (fallo)
    org.springframework.cache: trace
  pattern:
    # Lección 5: cada línea de log lleva el traceId de su petición -> [traceId=abc123...]
    level: "%5p [traceId=%X{traceId:-}]"
