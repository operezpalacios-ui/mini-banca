# =====================================================================================
# Lección 15: este fichero tiene la configuración COMÚN y SEGURA (pensada para producción).
# Lo propio de cada entorno va en su PERFIL:
#   application-dev.yml   -> tu ordenador (SQL en consola, .env, detalles de salud...)
#   application-prod.yml  -> servidor / Docker (logs en JSON, nada de chivatos)
# Si no se indica ningún perfil, se usa "dev" (ver abajo). En Docker se pone SPRING_PROFILES_ACTIVE=prod.
# Regla: los SECRETOS nunca se escriben aquí, solo ${VARIABLES} que vienen de fuera.
# =====================================================================================
spring:
  application:
    name: core
  profiles:
    default: dev
  mvc:
    async:
      # Lección 9: tiempo máximo de una respuesta en streaming (exportación CSV)
      request-timeout: 2m
  # Lección 11: Redis para la caché. Si no hay Redis, la app sigue funcionando (sin caché).
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: 2s
      timeout: 500ms        # si Redis tarda más, mejor ir a la BBDD que dejar al usuario esperando
      # Usamos Redis SOLO como caché, no para guardar entidades: así no busca "repositorios Redis"
      repositories:
        enabled: false
  datasource:
    # Sin valor por defecto: si falta DB_URL, la app NO arranca (mejor que conectarse a donde no debe)
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate      # Hibernate solo comprueba; las tablas las crea Flyway
    open-in-view: false
    show-sql: false

# Lección 8 (RF-0.3): clave compartida con el orquestador. Sin ella, /internal/** responde 401.
internal:
  api-key: ${INTERNAL_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        # Lección 13: también métricas. El core NO es público (en Docker su puerto no se publica),
        # por eso no lo protegemos con contraseña; en el orquestador, sí.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never     # en producción no contamos cómo es nuestra infraestructura (dev: always)
      probes:
        enabled: true         # /actuator/health/liveness y /readiness (los usa Docker)
  metrics:
    tags:
      application: ${spring.application.name}   # cada métrica lleva "application=core"
  info:
    env:
      enabled: true

info:
  app:
    nombre: Mini banca - core
    descripcion: Dominio y datos (cuentas, movimientos, transferencias)

logging:
  pattern:
    # Lección 5: cada línea de log lleva el traceId de su petición -> [traceId=abc123...]
    level: "%5p [traceId=%X{traceId:-}]"
