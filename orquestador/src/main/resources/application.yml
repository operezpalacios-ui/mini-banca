# =====================================================================================
# Lección 15: configuración COMÚN y SEGURA. Lo de cada entorno, en application-dev.yml / -prod.yml.
# Sin perfil -> "dev". En Docker: SPRING_PROFILES_ACTIVE=prod. Secretos: solo ${VARIABLES}.
# =====================================================================================
server:
  port: 8081          # el core usa el 8080; el orquestador, el 8081

spring:
  application:
    name: orquestador
  profiles:
    default: dev
  mvc:
    async:
      # Lección 9: tiempo máximo de una respuesta en streaming (exportación CSV)
      request-timeout: 2m

# Dónde está el core y cuánto estamos dispuestos a esperarle (RF-0.4)
core:
  url: ${CORE_URL}      # sin valor por defecto: en producción hay que decirlo SIEMPRE (dev: localhost)
  connect-timeout: 2s   # si en 2 s no consigo ni conectar, el core está caído
  read-timeout: 5s      # si conecta pero tarda más de 5 s en responder, dejo de esperar
  download-timeout: 2m  # lección 9: las descargas CSV pueden tardar más
  # Lección 8 (RF-0.3): la "contraseña" para hablar con el core. La misma que tiene el core.
  api-key: ${INTERNAL_API_KEY:}

# Lección 8 (RF-0.5): límite de lo que un usuario puede transferir en un día
transferencias:
  limite-diario: 1000.00

# Lección 10: webs que pueden llamar a la API desde el navegador (separadas por comas).
# Lección 15: en producción el frontend y la API van por el MISMO dominio (nginx hace de
# intermediario), así que CORS ni siquiera hace falta: por defecto, ninguna web extra.
cors:
  origenes-permitidos: ${CORS_ORIGINS:}

# Lección 7: tokens JWT. La clave SOLO la conoce el orquestador (RF-11).
jwt:
  secret: ${JWT_SECRET:}       # vacío -> la app NO arranca (mejor fallar pronto que firmar con nada)
  emisor: minibanca
  duracion: 15m                # access token de corta duración (RF-1.2)

# Lección 9 (RF-9.1): Swagger en http://localhost:8081/swagger-ui.html
# Lección 15: APAGADO por defecto (no regalamos el mapa de la API); el perfil dev lo enciende.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    persist-authorization: true    # no tener que pegar el token cada vez que recargas
    operations-sorter: method
    tags-sorter: alpha
  paths-to-match: /api/**          # el actuator no se documenta

management:
  endpoints:
    web:
      exposure:
        # Lección 13: health e info son públicos; metrics y prometheus, SOLO ADMIN (SecurityConfig)
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized   # el detalle, solo a un ADMIN; al resto, solo "UP"/"DOWN"
      roles: ADMIN
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true

info:
  app:
    nombre: Mini banca - orquestador
    descripcion: API pública (BFF) para el frontend

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
