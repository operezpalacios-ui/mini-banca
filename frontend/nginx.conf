# Lección 14: configuración de nginx para una SPA (Single Page Application) como Angular.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Si alguien entra directamente en /cuentas/7, ese fichero NO existe en el disco: es una ruta de Angular.
    # try_files: "busca el fichero; si no existe, devuelve index.html" y Angular pinta la pantalla correcta.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html NUNCA en caché: es el que apunta a los ficheros JS nuevos tras cada despliegue.
    # (Ojo con nginx: si un "location" pone add_header, NO hereda los de fuera; por eso se repiten.)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Los .js y .css llevan un "hash" en el nombre (main-5NEJI4NP.js): si cambian, cambia el nombre.
    # Por eso el navegador puede guardarlos un año sin miedo a usar una versión vieja.
    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
