# Lección 14-15: configuración de nginx para una SPA (Single Page Application) como Angular.

# Lección 16 (bug real de Codespaces): si DELANTE de nginx hay otro proxy (GitHub Codespaces, un
# balanceador con HTTPS...), ese proxy ya nos dice cómo llegó el navegador (X-Forwarded-*).
# Lo respetamos; si no hay nadie delante, usamos lo que ve nginx. "map" = "si vale X, usa Y".
map $http_x_forwarded_proto $proto_original {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_x_forwarded_host $host_original {
    default $http_x_forwarded_host;
    ""      $http_host;          # $http_host conserva el puerto (localhost:4200); $host lo pierde
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Lección 15: PROXY INVERSO. Todo lo que empiece por /api/ no es un fichero: nginx se lo
    # reenvía al orquestador por la red interna de Docker ("orquestador" = nombre del servicio).
    # Para el navegador, la web y la API son el MISMO sitio -> no hace falta CORS.
    # (Fíjate en que /actuator NO se reenvía: las métricas no salen a internet.)
    location /api/ {
        proxy_pass http://orquestador:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Lección 16: le contamos al orquestador la dirección REAL que ve el navegador
        # (https://xxx.app.github.dev), no la interna (http://orquestador:8081). Si no, Spring
        # cree que la web es "otro sitio" y rechaza el login con 403 "Invalid CORS request".
        proxy_set_header X-Forwarded-Proto $proto_original;
        proxy_set_header X-Forwarded-Host $host_original;
        proxy_read_timeout 120s;      # las descargas CSV pueden tardar
        proxy_buffering off;          # y llegan en streaming: que nginx no las acumule
    }

    # Si alguien entra directamente en /cuentas/7, ese fichero NO existe en el disco: es una ruta de Angular.
    # try_files: "busca el fichero; si no existe, devuelve index.html" y Angular pinta la pantalla correcta.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html NUNCA en caché: es el que apunta a los ficheros JS nuevos tras cada despliegue.
    # (Ojo con nginx: si un "location" pone add_header, NO hereda los de fuera; por eso se repiten.)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Los .js y .css llevan un "hash" en el nombre (main-5NEJI4NP.js): si cambian, cambia el nombre.
    # Por eso el navegador puede guardarlos un año sin miedo a usar una versión vieja.
    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
