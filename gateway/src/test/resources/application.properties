# Configuración SOLO para los tests del gateway (gana sobre application.yml).
# Redis "inexistente" a propósito: los tests no dependen de un Redis. Sin Redis, el limitador
# deja pasar las peticiones (que es justo el comportamiento que queremos en producción).
spring.data.redis.url=redis://127.0.0.1:1
# ...y que no llene la consola con el error "no puedo conectar con Redis" en cada petición
logging.level.org.springframework.cloud.gateway.filter.ratelimit.RedisRateLimiter=off
# orquestador.url la pone cada test (apunta a un orquestador FALSO, ver GatewayTest)
