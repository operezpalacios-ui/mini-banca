# =====================================================================================
# API GATEWAY: configuración COMÚN. Lo de cada entorno, en application-dev.yml / -prod.yml.
# Sin perfil -> "dev". En Docker: SPRING_PROFILES_ACTIVE=prod. Secretos: ninguno (el gateway
# no conoce ni la clave JWT ni la clave interna: no le hacen falta).
# =====================================================================================
server:
  port: 8082          # core 8080, orquestador 8081, gateway 8082

spring:
  application:
    name: gateway
  profiles:
    default: dev
  data:
    redis:
      # El mismo Redis que usa el core. Sin Redis el gateway funciona, pero SIN limitador.
      url: ${REDIS_URL:redis://localhost:6379}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000      # ms: si en 2 s no conecta con el orquestador, está caído
            response-timeout: 15s      # tiempo máximo hasta que el orquestador EMPIEZA a responder
          # ---- Cabeceras X-Forwarded-* (¡importante! ver lección 16) ----
          # nginx le dice al orquestador cómo llegó el navegador (X-Forwarded-Proto / -Host). Si el
          # gateway las borrara o les añadiera lo suyo ("http", "gateway:8082"), el orquestador
          # creería que la web es "otro sitio" y el login fallaría con 403 "Invalid CORS request".
          # Por eso: 1) confiamos en los proxies de la red interna (si no, el gateway las BORRA),
          #          2) el filtro X-Forwarded sigue ENCENDIDO (¡apagarlo también las borra!), pero
          #             sin añadir ni cambiar nada -> pasan TAL CUAL las puso nginx (GatewayTest).
          trusted-proxies: "127\\..*|0:0:0:0:0:0:0:1|::1|10\\..*|172\\.(1[6-9]|2[0-9]|3[01])\\..*|192\\.168\\..*"
          x-forwarded:
            enabled: true
            for-enabled: false
            host-enabled: false
            proto-enabled: false
            port-enabled: false
            prefix-enabled: false
          # La cabecera estándar "Forwarded" (RFC 7239) NO la usamos. Apagada = el gateway la BORRA,
          # y eso nos conviene: Spring la mira ANTES que las X-Forwarded-*, así que un cliente no
          # puede colar una falsa para engañar al orquestador.
          forwarded:
            enabled: false

# Dónde está el orquestador y cuánto le esperamos (circuit breaker + time limiter)
orquestador:
  url: ${ORQUESTADOR_URL}        # sin valor por defecto: en producción hay que decirlo SIEMPRE
  timeout: 20s                   # por encima de los 10 s que el orquestador espera al core
  timeout-descargas: 150s        # CSV: por encima de los 2 min del orquestador

# Limitador de peticiones por IP (ver LimitadoresConfig). Ajustables por variable de entorno.
limites:
  api:
    fichas-por-segundo: ${LIMITE_API_POR_SEGUNDO:20}
    burst: ${LIMITE_API_BURST:40}
  auth:
    fichas-por-segundo: ${LIMITE_AUTH_POR_SEGUNDO:1}
    burst: ${LIMITE_AUTH_BURST:60}
    fichas-por-peticion: ${LIMITE_AUTH_POR_PETICION:6}

management:
  endpoints:
    web:
      exposure:
        # El gateway NO enruta /actuator: esto solo se ve desde dentro de Docker (healthcheck).
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      access: read-only        # /actuator/gateway/routes: ver las rutas, sin poder cambiarlas
  health:
    redis:
      enabled: false           # sin Redis el gateway sigue funcionando: que no se marque como DOWN
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    nombre: Mini banca - gateway
    descripcion: Puerta de entrada de la API (enrutado, limitador, circuit breaker, traceId)
